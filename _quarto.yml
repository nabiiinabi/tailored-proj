# Site setup. `quarto render` turns the .qmd files into the website in docs/.
project:
  type: website
  output-dir: docs
  # Files to copy into docs/ as they are. .nojekyll tells GitHub Pages
  # not to run Jekyll, which would hide folders whose names start with _.
  resources:
    - .nojekyll
    - images/frequentists_vs_bayesians_2x.png

# Sidebar links, in reading order. The text here is the link label.
# The page title still comes from each .qmd file.
# https://quarto.org/docs/websites/website-navigation.html
website:
  title: "Beyond Pass or Fail"
  # Needed so Quarto can write sitemap.xml and robots.txt.
  site-url: https://nabiiinabi.github.io/tailored-proj/
  navbar:
    pinned: true
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - href: index.qmd
        text: "Home"
        icon: book
      - href: the-question.qmd
        text: "The Question"
      - href: section-1.qmd
        text: "From Twenty Movies to an Unknown Proportion"
      - href: section-3-4.qmd
        text: "Two Ways to Describe Uncertainty"
      - href: section-5.qmd
        text: "A Brief Frequentist Analysis"
      - href: section-6-7.qmd
        text: "Beginning the Bayesian Analysis"
      - href: section-8-9.qmd
        text: "What Do Alpha and Beta Control?"
      - href: section-10-11.qmd
        text: "Updating with Bayes' Rule"
      - href: section-12-13.qmd
        text: "The Posterior Mean and Shrinkage"
      - href: section-14-15.qmd
        text: "Does the Prior Change the Conclusion?"
      - href: section-16-17.qmd
        text: "Learning One Movie at a Time"
      - href: section-18.qmd
        text: "Tweets After a Movie Release"
      - href: section-19-20.qmd
        text: "Comparing the Frequentist and Bayesian Results"
      - href: section-21.qmd
        text: "Conclusions and Takeaways"

format:
  html:
    # "Last updated" uses the file's last edit time
    date: last-modified
    published-title: "Last updated"
    date-format: "MMMM D, YYYY"
    toc: true
    toc-expand: true
    crossrefs-hover: false
    code-line-numbers: true
    highlight-style: arrow
    # journal is the base theme. theme-light.scss overrides its colors and layout.
    # https://quarto.org/docs/output-formats/html-themes.html
    theme:
      light: [journal, theme-light.scss]
    fontsize: 13pt
    # Reference list for pages that cite bib/library.bib. ASA author-date style.
    bibliography: bib/library.bib
    csl: bib/american-statistical-association.csl

# Hide the code that builds the figures. Readers see the figure
# Also hide R messages and warnings if a chunk prints them.
execute:
  echo: false
  message: false
  warning: false
